experience:
  - role: Senior Mobile Engineer
    company: Preglife
    url: https://apps.apple.com/pl/app/id390427747
    tagline: "Aplikacja dla kobiet w ciąży i rodziców, 11 rynków · App Store 4,9/5, 29 tys. ocen · apps.apple.com/pl/app/id390427747"
    location: Katowice
    start: maj 2022
    end: obecnie
    bullets:
      - "W nowej aplikacji Preglife w React Native / Expo (iOS + Android), wydanej w październiku 2026 w miejsce obu aplikacji natywnych, odpowiadam za moduł ofert i reklam, współdzielenie konta oraz import danych z aplikacji natywnych."
      - "Zbudowałem od warstwy danych po analitykę moduły Narzędzia, Wellness i Checklista. W synchronizacji local-first (SQLite), logowaniu i onboardingu moje były: ścieżka importu danych z aplikacji natywnych (przejęcie starego logowania, zgłaszanie zaimportowanych ciąż i dzieci do Profile Engine, odblokowanie zatrzymanych importów), sesja odporna na zmianę rynku, ulubione i porady dnia jako dane konta oraz zgody zdrowotne przy rejestracji."
      - "Aplikację budujemy od maja 2026 w pięcioosobowym zespole. Zmiana technologii była dla użytkowników niewidoczna: z kontem i lokalni bez konta przeszli na nią zwykłą aktualizacją, bez utraty danych."
      - "Napisałem natywne moduły Expo w Kotlinie i Swifcie: mostek Braze, który wstrzymuje inicjalizację SDK do czasu konfiguracji z JS (bez utraty zdarzeń ze startu sesji) i przekazuje akcje wiadomości in-app do aplikacji, oraz moduł widgetu ekranu głównego na iOS i Android (Glance); deep linki z powiadomień push działają także przy zimnym starcie."
      - "2022–2026: w zespole iOS liczącym 2–4 osoby współprojektowałem i utrzymywałem modułową architekturę dwóch natywnych aplikacji iOS (UIKit i SwiftUI; międzynarodowej i norweskiej) dla 11 rynków, ok. 70 pakietów Swift na wspólnym kodzie; sam założyłem 26 z nich, m.in. warstwę sieciową i API (REST, GraphQL z Apollo), modele domenowe użytkownika, ciąży i dziecka, serwis Braze, mapowanie widgetów z GraphQL na UI oraz obsługę deep linków. Świadomy kompromis: wyraźne granice modułów kosztem czasu pełnego builda (graf zależności SPM tej wielkości spowalnia kompilację)."
      - "Zbudowałem moduły Onboarding, Ustawienia, Oferty, Narzędzia, Wyszukiwarka, Statystyki i Sleep Sounds (silnik audio, timery w tle, widget) oraz widgety ekranu głównego."
      - "Zaprojektowałem i wdrożyłem system motywów aplikacji: kolory, czcionki i odstępy zdefiniowane w jednym miejscu, dzięki czemu cykliczne odświeżanie wyglądu nie wymaga zmian w kodzie funkcji."
      - "Odpowiadałem za integracje zewnętrzne i partnerskie: Braze, AppsFlyer, reklamy natywne Kevel, subskrypcje RevenueCat, Contentful, Apollo GraphQL, ubezpieczyciele If Finlandia i Tryg Dania, weryfikacja tożsamości MitID."
      - "Zbudowałem i prowadziłem proces wydawniczy obu aplikacji (2–6 wydań miesięcznie): pipeline'y Fastlane i GitHub Actions do TestFlight i App Store, podpisywanie kodu przez Match, lint i formatowanie w każdym PR."

