experience:
  - role: Senior Mobile Engineer
    company: Preglife
    url: https://apps.apple.com/app/id390427747
    tagline: "App for expecting and new parents, 11 markets · App Store 4.9/5, 29k ratings · apps.apple.com/app/id390427747"
    location: Katowice, Poland
    start: May 2022
    end: present
    bullets:
      - "In Preglife's new React Native / Expo app (iOS + Android), released in October 2026 in place of both native apps, own the offers and ads module, account sharing and the import of data from the native apps."
      - "Built the Tools, Wellness and Checklist modules from the data layer through to analytics. In local-first SQLite sync, authentication and onboarding my own work was the import path from the native apps (adopting the legacy login, reporting imported pregnancies and babies to the Profile Engine, unblocking stalled imports), a session that survives a market change, favourites and daily tips as account data, and health consents at registration."
      - "The app has been built by a team of five since May 2026. The technology switch was invisible to users: both account-based and local-only users moved over through a regular update, without data loss."
      - "Wrote native Expo modules in Kotlin and Swift: a Braze bridge that defers SDK initialisation until JS has configured it (no lost session-start events) and routes in-app message actions to the app, and a home-screen widget module for iOS and Android (Glance); push-notification deep links work on a cold start too."
      - "2022–2026: in an iOS team of 2–4 engineers, co-designed and maintained the modular architecture of two native iOS apps (UIKit and SwiftUI; international and Norwegian) for 11 markets, ~70 Swift packages on a shared codebase; I created 26 of them myself, including the networking and API layer (REST, GraphQL with Apollo), the user, pregnancy and baby domain models, the Braze service, GraphQL-widget-to-UI mapping and deep-link handling. A deliberate trade-off: clear module boundaries at the cost of full-build time, because an SPM dependency graph of that size slows package resolution and compilation."
      - "Built the Onboarding, Settings, Offers, Tools, Search, Statistics and Sleep Sounds modules (audio engine, background timers, widget) and the home-screen widgets."
      - "Designed and implemented the app's theming system: colours, typography and spacing defined in one place, so periodic visual refreshes need no changes to feature code."
      - "Owned third-party and partner integrations: Braze, AppsFlyer, Kevel native ads, RevenueCat subscriptions, Contentful, Apollo GraphQL, insurers If Finland and Tryg Denmark, MitID identity verification."
      - "Built and ran the release process for both apps (2–6 releases a month): Fastlane and GitHub Actions pipelines to TestFlight and the App Store, code signing with Match, lint and format checks on every PR."

